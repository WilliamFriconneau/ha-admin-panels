<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="100%" stop-color="#21262d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="52" fill="url(#bg)"/>

  <g transform="translate(40, 40)">
    <!-- top-left -->
    <rect x="0"   y="0"   width="80" height="80" rx="14" fill="url(#tile)"/>
    <rect x="14"  y="18"  width="40" height="6" rx="3" fill="#8b949e" opacity="0.55"/>
    <rect x="14"  y="32"  width="52" height="6" rx="3" fill="#8b949e" opacity="0.32"/>
    <circle cx="62" cy="62" r="5" fill="#3fb950" opacity="0.85"/>

    <!-- top-right (accent) -->
    <rect x="96"  y="0"   width="80" height="80" rx="14" fill="url(#accent)" filter="url(#glow)"/>
    <g transform="translate(122, 22)" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M10 28 L28 10"/>
      <path d="M14 10 L28 10 L28 24"/>
    </g>

    <!-- bottom-left -->
    <rect x="0"   y="96"  width="80" height="80" rx="14" fill="url(#tile)"/>
    <rect x="14"  y="114" width="40" height="6" rx="3" fill="#8b949e" opacity="0.55"/>
    <rect x="14"  y="128" width="32" height="6" rx="3" fill="#8b949e" opacity="0.32"/>
    <circle cx="62" cy="158" r="5" fill="#3fb950" opacity="0.85"/>

    <!-- bottom-right -->
    <rect x="96"  y="96"  width="80" height="80" rx="14" fill="url(#tile)"/>
    <rect x="110" y="114" width="40" height="6" rx="3" fill="#8b949e" opacity="0.55"/>
    <rect x="110" y="128" width="52" height="6" rx="3" fill="#8b949e" opacity="0.32"/>
    <circle cx="158" cy="158" r="5" fill="#d29922" opacity="0.85"/>
  </g>
</svg>
