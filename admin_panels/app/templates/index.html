<!DOCTYPE html>
<html lang="en">
<head>
    <base href="{{ ingress_path }}/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panels</title>
    <link rel="stylesheet" href="static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" crossorigin="anonymous">
</head>
<body>
    <header>
        <h1>Admin Panels</h1>
        <button id="refresh-btn" type="button" title="Refresh status">
            <span class="mdi mdi-refresh"></span>
        </button>
    </header>

    <main>
        {% if panels|length == 0 %}
        <div class="empty">
            <span class="mdi mdi-cog-outline"></span>
            <p>No panels configured.</p>
            <p>Open the addon configuration tab and add panels with a name and URL.</p>
        </div>
        {% else %}
        <div class="grid">
            {% for p in panels %}
            <div class="tile" data-idx="{{ loop.index0 }}">
                <a class="tile-main" href="proxy/{{ loop.index0 }}/">
                    <div class="tile-icon">
                        <span class="mdi {{ ('mdi-' + p.icon[4:]) if p.icon.startswith('mdi:') else 'mdi-web' }}"></span>
                    </div>
                    <div class="tile-body">
                        <div class="tile-name">{{ p.name }}</div>
                        <div class="tile-url">{{ p.url }}</div>
                        <div class="tile-status status-pending" data-status="{{ loop.index0 }}">
                            <span class="dot"></span>
                            <span class="label">Checking…</span>
                        </div>
                    </div>
                </a>
                <div class="tile-actions">
                    <button class="tile-action tile-direct" type="button" data-url="{{ p.url }}" title="Open direct upstream URL (LAN only — bypasses proxy, password managers work)">
                        <span class="mdi mdi-lan"></span>
                    </button>
                    <button class="tile-action tile-newtab" type="button" data-idx="{{ loop.index0 }}" title="Open via proxy in new tab (works remote, password manager won't autofill)">
                        <span class="mdi mdi-open-in-new"></span>
                    </button>
                </div>
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </main>

    <footer>
        <span>Admin Panels addon · status refresh every {{ ping_interval }}s</span>
    </footer>

    <script>
    (function() {
        const PING_INTERVAL_MS = {{ ping_interval }} * 1000;

        function absoluteProxyUrl(idx) {
            return new URL("proxy/" + idx + "/", document.baseURI).href;
        }

        document.querySelectorAll('.tile-newtab').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                window.open(absoluteProxyUrl(btn.dataset.idx), '_blank', 'noopener');
            });
        });

        document.querySelectorAll('.tile-direct').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                var url = btn.dataset.url;
                if (url) window.open(url, '_blank', 'noopener');
            });
        });

        async function refresh() {
            try {
                const res = await fetch("api/ping", { cache: "no-store" });
                if (!res.ok) throw new Error("ping " + res.status);
                const data = await res.json();
                for (const item of data) {
                    const el = document.querySelector('[data-status="' + item.idx + '"]');
                    if (!el) continue;
                    el.classList.remove("status-pending", "status-ok", "status-down");
                    if (item.ok) {
                        el.classList.add("status-ok");
                        el.querySelector(".label").textContent = "Online (" + item.status + ")";
                    } else {
                        el.classList.add("status-down");
                        el.querySelector(".label").textContent = item.error || "Offline";
                    }
                }
            } catch (e) {
                console.warn("ping refresh failed", e);
            }
        }

        document.getElementById("refresh-btn")?.addEventListener("click", refresh);
        refresh();
        setInterval(refresh, PING_INTERVAL_MS);
    })();
    </script>
</body>
</html>
