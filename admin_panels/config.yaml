name: Admin Panels
version: "0.1.1"
slug: admin_panels
description: Lightweight launcher for admin web UIs (router, NAS, IoT bridges...) with reverse proxy via HA ingress.
url: https://github.com/WilliamFriconneau/ha-admin-panels
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:view-dashboard-variant
panel_title: Admin Panels
panel_admin: true
host_network: false
options:
  panels:
    - name: Example Router
      url: http://example.local
      icon: mdi:router-network
  ping_interval: 30
  request_timeout: 5
schema:
  panels:
    - name: str
      url: url
      icon: str?
      verify_tls: bool?
  ping_interval: int(5,3600)?
  request_timeout: int(1,60)?
